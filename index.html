<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08080d">
<title>K ♥ G</title>
<style>
:root{--bg:#08080d;--pink:#ff91b9;--pink2:#ff5d9b;--red:#ed263b;--white:#fff5f8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 15% 20%,#a40d252b,transparent 34%),radial-gradient(ellipse at 85% 65%,#ff70a51c,transparent 35%),var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}
.top{width:min(1000px,90%);margin:auto;padding:22px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff1a}
.brand{font:700 25px Georgia,serif;color:#fff;text-decoration:none}.brand span{color:var(--pink2)}
.top small{font-size:11px;letter-spacing:2px;color:#e8b9cb}
main{width:min(1000px,90%);margin:auto}
.hero{min-height:35vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 0 25px}
.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--pink);font-weight:bold}
h1{font:700 clamp(70px,14vw,120px)/1 Georgia,serif;letter-spacing:-4px;margin:13px 0;color:#fff;text-shadow:0 0 35px #ff5d9b40}
h1 span{color:var(--pink2)}
.hero p{font-size:12px;color:#d6b7c3;letter-spacing:2px}
.art-area{position:relative;max-width:850px;margin:0 auto 25px;padding:24px;border:1px solid #ff91b94d;border-radius:24px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);box-shadow:0 20px 65px #0008}
.art-area:before,.art-area:after{content:"🎀";position:absolute;font-size:30px;z-index:2;filter:drop-shadow(0 3px 8px #0008)}
.art-area:before{top:-17px;left:22px;transform:rotate(-14deg)}
.art-area:after{right:22px;bottom:-17px;transform:rotate(14deg)}
.art-image{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;border-radius:12px}
.web{position:fixed;width:150px;height:150px;opacity:.48;pointer-events:none;z-index:0}
.web.left{left:-38px;top:25%}.web.right{right:-38px;bottom:18%;transform:rotate(45deg)}
main,.top,footer{position:relative;z-index:1}
.love-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px;padding:24px 0 18px;color:var(--pink);font-size:11px;font-weight:bold;letter-spacing:3px}
.love-strip span:nth-child(2n){color:#ff5262}.love-strip span:nth-child(3n){color:#ffd1e1}
.bow-row{text-align:center;font-size:18px;letter-spacing:17px;padding:8px 0 35px}
footer{text-align:center;border-top:1px solid #ffffff18;padding:22px 10px 30px;color:#b99aa8;font-size:10px;letter-spacing:3px}
.floating{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.float{position:absolute;top:-35px;animation:fall linear forwards;opacity:.8}
@keyframes fall{to{transform:translateY(110vh) rotate(180deg);opacity:0}}
@media(max-width:600px){.hero{min-height:30vh}.art-area{padding:12px;border-radius:17px}.art-image{max-height:none}.web{width:105px;height:105px}.web.left{left:-42px}.web.right{right:-42px}.love-strip{font-size:9px;letter-spacing:2px;gap:10px 14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#">K <span>♥</span> G</a><small>🎀　♡　🎀</small></header>
<svg class="web left" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#ff9fc2" stroke-width="1.5"><path d="M0 0L200 200M100 0V200M0 100H200M200 0L0 200M0 0Q100 30 200 0M0 0Q30 100 0 200M0 200Q100 170 200 200M200 0Q170 100 200 200"/></g></svg>
<svg class="web right" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#ed263b" stroke-width="1.5"><path d="M0 0L200 200M100 0V200M0 100H200M200 0L0 200M0 0Q100 30 200 0M0 0Q30 100 0 200M0 200Q100 170 200 200M200 0Q170 100 200 200"/></g></svg>
<main>
<section class="hero">
<div class="eyebrow">♡ K & G ♡</div>
<h1>K <span>♥</span> G</h1>
<p>G　🩷　K</p>
</section>
<section class="art-area">
<img class="art-image" src="k-g-desenho.jpg" alt="Desenho da Hello Kitty ao lado de uma figura inspirada no Homem-Aranha">
</section>
<div class="love-strip"><span>I LOVE YOU ♡</span><span>♡ I LOVE YOU</span><span>I LOVE YOU 🎀</span><span>♥ I LOVE YOU ♥</span><span>I LOVE YOU ♡</span></div>
<div class="bow-row" aria-hidden="true">🎀　♡　🎀　♡　🎀</div>
</main>
<footer>K ♥ G　·　I LOVE YOU　·　🎀</footer>
<div class="floating" id="decor" aria-hidden="true"></div>
<script>
const decor=document.getElementById("decor");
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
 setInterval(()=>{
  const item=document.createElement("span");
  item.className="float";
  item.textContent=Math.random()>.55?"🎀":(Math.random()>.5?"♡":"♥");
  item.style.left=Math.random()*100+"vw";
  item.style.fontSize=(12+Math.random()*13)+"px";
  item.style.animationDuration=(8+Math.random()*6)+"s";
  decor.appendChild(item);
  item.addEventListener("animationend",()=>item.remove(),{once:true});
 },1100);
}
</script>
</body>
</html>
