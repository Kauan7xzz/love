<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08080d">
<title>K ♥ G</title>
<style>
:root{--bg:#07070b;--pink:#ff91b9;--pink2:#ff5d9b;--red:#ed263b;--blue:#1767bd;--white:#fff5f8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 16% 22%,#a40d252b,transparent 34%),radial-gradient(ellipse at 85% 60%,#ff70a51c,transparent 35%),var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}
.top{width:min(1000px,90%);margin:auto;padding:22px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff1a}
.brand{font:700 25px Georgia,serif;color:#fff;text-decoration:none}.brand span{color:var(--pink2)}
.top small{font-size:11px;letter-spacing:2px;color:#e8b9cb}
main{width:min(1000px,90%);margin:auto}
.hero{position:relative;min-height:43vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 0 35px}
.hero h1{font:700 clamp(70px,14vw,125px)/1 Georgia,serif;letter-spacing:-4px;margin:10px 0;color:#fff;text-shadow:0 0 35px #ff5d9b40}
.hero h1 span{color:var(--pink2)}
.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--pink);font-weight:bold}
.hero p{font-size:13px;color:#d6b7c3;letter-spacing:1px}
.stage{position:relative;padding:25px 0 75px}
.stage:before,.stage:after{content:"";position:absolute;width:190px;height:190px;border:2px solid #ff91b94d;border-radius:50%;pointer-events:none}
.stage:before{left:-135px;top:65px}.stage:after{right:-135px;bottom:60px}
.web{position:absolute;width:190px;height:190px;opacity:.72;pointer-events:none}
.web.left{left:-55px;top:15px}.web.right{right:-55px;bottom:5px;transform:rotate(45deg)}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:820px;margin:auto}
.card{position:relative;min-height:445px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:20px 15px 28px;border:1px solid #ffffff20;border-radius:24px;background:linear-gradient(150deg,#ffffff10,#ffffff03);overflow:hidden;box-shadow:0 18px 55px #0008}
.card.spider{border-color:#ed263b66;background:linear-gradient(150deg,#ed263b15,#1767bd0b)}
.card.kitty{border-color:#ff91b966;background:linear-gradient(150deg,#ff91b91c,#fff0f507)}
.card:before{content:"";position:absolute;width:230px;height:230px;top:35px;border-radius:50%;filter:blur(65px);opacity:.24}
.spider:before{background:#ed263b}.kitty:before{background:#ff91b9}
.art{position:absolute;top:26px;left:0;width:100%;height:290px;display:grid;place-items:center}
.art svg{height:100%;width:min(100%,270px);overflow:visible;filter:drop-shadow(0 14px 12px #0008)}
.spider-suit{fill:#1767bd;stroke:#0c326d;stroke-width:2}
.spider-red{fill:#ed263b;stroke:#8d1021;stroke-width:2}
.spider-web{fill:none;stroke:#ffdce4;stroke-width:1.5;opacity:.9}
.spider-eye{fill:#fff;stroke:#17294a;stroke-width:2}
.kitty-fur{fill:#fff;stroke:#d9cbd1;stroke-width:2.5}
.kitty-bow{fill:#ed263b;stroke:#9d1022;stroke-width:2}
.kitty-eye{fill:#25212a}.kitty-nose{fill:#f0c43d}
.whisker{fill:none;stroke:#29242b;stroke-width:2.2;stroke-linecap:round}
.kitty-cheek{fill:#ff9dbd;opacity:.75}
.letter{position:relative;z-index:2;font:700 55px Georgia,serif;margin:0 0 7px}
.spider .letter{color:#ff5262;text-shadow:0 0 18px #ed263b55}
.kitty .letter{color:#ff9fc2;text-shadow:0 0 18px #ff91b955}
.name{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#e9c8d5}
.love-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px;padding:35px 0 18px;color:var(--pink);font-size:11px;font-weight:bold;letter-spacing:3px}
.love-strip span:nth-child(2n){color:#ff5262}.love-strip span:nth-child(3n){color:#ffd1e1}
.bow-row{text-align:center;font-size:18px;letter-spacing:17px;padding:5px 0 35px}
.floating-decor{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.float{position:absolute;top:-35px;animation:fall linear forwards;opacity:.8}
@keyframes fall{to{transform:translateY(110vh) rotate(180deg);opacity:0}}
footer{text-align:center;border-top:1px solid #ffffff18;padding:22px 10px 30px;color:#b99aa8;font-size:10px;letter-spacing:3px}
@media(max-width:620px){.hero{min-height:35vh}.grid{gap:12px}.card{min-height:375px;padding:15px 8px 24px;border-radius:18px}.art{height:235px;top:18px}.letter{font-size:47px}.name{font-size:9px;letter-spacing:2px}.web{width:125px;height:125px}.web.left{left:-55px}.web.right{right:-55px}.stage:before,.stage:after{width:120px;height:120px}}
@media(max-width:390px){.card{min-height:350px}.art{height:210px}.love-strip{gap:10px;font-size:9px;letter-spacing:2px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#">K <span>♥</span> G</a><small>🎀　♡　🎀</small></header>
<main>
<section class="hero">
<div class="eyebrow">♡ K & G ♡</div>
<h1>K <span>♥</span> G</h1>
<p>SPIDER-MAN　×　HELLO KITTY</p>
</section>
<section class="stage" aria-label="Homem-Aranha e Hello Kitty">
<svg class="web left" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#ff9fc2" stroke-width="1.4"><path d="M0 0L200 200M100 0V200M0 100H200M200 0L0 200M0 0Q100 30 200 0M0 0Q30 100 0 200M0 200Q100 170 200 200M200 0Q170 100 200 200"/></g></svg>
<svg class="web right" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#ed263b" stroke-width="1.4"><path d="M0 0L200 200M100 0V200M0 100H200M200 0L0 200M0 0Q100 30 200 0M0 0Q30 100 0 200M0 200Q100 170 200 200M200 0Q170 100 200 200"/></g></svg>
<div class="grid">
<article class="card spider">
<div class="art">
<svg viewBox="0 0 260 290" role="img" aria-label="Homem-Aranha em traje vermelho e azul">
<!-- torso and legs -->
<path class="spider-suit" d="M91 143Q130 125 169 143L187 210L166 229L151 188L150 274L111 274L108 190L92 229L73 210Z"/>
<path class="spider-red" d="M91 143Q130 125 169 143L177 177Q130 197 83 177Z"/>
<path class="spider-suit" d="M91 145L65 158L43 218L61 226L93 180M169 145L195 158L217 218L199 226L167 180"/>
<path class="spider-red" d="M43 218L61 226L56 246L35 240ZM217 218L199 226L204 246L225 240Z"/>
<!-- neck and mask -->
<path class="spider-red" d="M112 128L112 144L148 144L148 128Z"/>
<path class="spider-red" d="M83 53Q83 15 130 12Q177 15 177 53L168 112Q158 143 130 145Q102 143 92 112Z"/>
<!-- mask web pattern -->
<g class="spider-web"><path d="M130 14V141M91 49L169 49M86 77L174 77M91 106L169 106M100 127L160 127M130 14L91 49L86 77L91 106L100 127M130 14L169 49L174 77L169 106L160 127"/><path d="M130 48L104 65L130 83L156 65L130 48ZM130 83L106 103L130 121L154 103L130 83Z"/></g>
<path class="spider-eye" d="M94 73Q108 61 121 76L112 99Q99 98 94 73ZM166 73Q152 61 139 76L148 99Q161 98 166 73Z"/>
<!-- chest spider emblem -->
<g fill="#111827" stroke="#111827" stroke-width="1.5"><ellipse cx="130" cy="161" rx="5" ry="12"/><path d="M126 155L114 147L109 151L122 163L110 173L115 177L130 166L145 177L150 173L138 163L151 151L146 147L134 155L130 145Z"/></g>
</svg>
</div>
<div class="letter">K</div><div class="name">Spider-Man</div>
</article>
<article class="card kitty">
<div class="art">
<svg viewBox="0 0 260 290" role="img" aria-label="Hello Kitty branca com laço vermelho">
<!-- body -->
<path class="kitty-fur" d="M80 193Q130 175 180 193L191 253Q130 274 69 253Z"/>
<path d="M89 209Q130 221 171 209L176 252Q130 266 84 252Z" fill="#ff9fc2"/>
<!-- head silhouette and ears -->
<path class="kitty-fur" d="M65 105L53 43L105 69Q130 58 155 69L207 43L195 105Q213 142 193 178Q174 211 130 211Q86 211 67 178Q47 142 65 105Z"/>
<!-- bow -->
<path class="kitty-bow" d="M99 68Q54 20 39 51Q29 82 89 94L113 82ZM161 68Q206 20 221 51Q231 82 171 94L147 82Z"/><circle cx="130" cy="78" r="13" fill="#ff667f" stroke="#9d1022" stroke-width="2"/>
<!-- face -->
<ellipse class="kitty-eye" cx="96" cy="137" rx="5.5" ry="9"/><ellipse class="kitty-eye" cx="164" cy="137" rx="5.5" ry="9"/>
<ellipse class="kitty-nose" cx="130" cy="151" rx="6" ry="4"/>
<path class="whisker" d="M82 151L48 143M82 164L50 171M178 151L212 143M178 164L210 171"/>
<ellipse class="kitty-cheek" cx="77" cy="157" rx="13" ry="7"/><ellipse class="kitty-cheek" cx="183" cy="157" rx="13" ry="7"/>
</svg>
</div>
<div class="letter">G</div><div class="name">Hello Kitty</div>
</article>
</div>
</section>
<div class="love-strip" aria-label="I love you decorativo"><span>I LOVE YOU ♡</span><span>♡ I LOVE YOU</span><span>I LOVE YOU 🎀</span><span>♥ I LOVE YOU ♥</span><span>I LOVE YOU ♡</span></div>
<div class="bow-row" aria-hidden="true">🎀　♡　🎀　♡　🎀</div>
</main>
<footer>K ♥ G　·　I LOVE YOU　·　🎀</footer>
<div class="floating-decor" id="decor" aria-hidden="true"></div>
<script>
const decor=document.getElementById("decor");
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
 setInterval(()=>{
  const item=document.createElement("span");
  item.className="float";
  item.textContent=Math.random()>.55?"🎀":(Math.random()>.5?"♡":"♥");
  item.style.left=Math.random()*100+"vw";
  item.style.fontSize=(12+Math.random()*13)+"px";
  item.style.animationDuration=(8+Math.random()*6)+"s";
  decor.appendChild(item);
  item.addEventListener("animationend",()=>item.remove(),{once:true});
 },1100);
}
</script>
</body>
  </html>
